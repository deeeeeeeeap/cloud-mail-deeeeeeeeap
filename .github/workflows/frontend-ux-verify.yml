name: Verify frontend UX source

on:
  push:
    branches: [codex/frontend-ux-20260910]

permissions:
  contents: write

concurrency:
  group: frontend-ux-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'deeeeeeeeap/cloud-mail-deeeeeeeeap' && github.ref == 'refs/heads/codex/frontend-ux-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-vue/pnpm-lock.yaml
      - name: Verify source hashes and apply frontend edits
        run: |
          node .github/frontend-ux-apply.cjs
          git diff --check
      - name: Frozen dependencies, full tests and production build (no deployment)
        run: node scripts/cloudflare-workers-git-build.mjs
      - name: Commit verified source and remove temporary transfer files
        run: |
          git rm .github/frontend-ux-transfer-*.b64 .github/frontend-ux-apply.cjs .github/workflows/frontend-ux-verify.yml
          git add mail-vue doc/frontend-ux-20260910.md
          git diff --cached --check
          ROOT_TREE="$(git write-tree)"
          FRONTEND_TREE="$(git ls-tree "$ROOT_TREE" mail-vue | awk '{print $3}')"
          test "$FRONTEND_TREE" = '6702bb8112f2fb5cd50d662d5ef327dc76c18cda'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: refine code center, mobile navigation and safe draft closing'
          git push origin HEAD:refs/heads/codex/frontend-ux-20260910
