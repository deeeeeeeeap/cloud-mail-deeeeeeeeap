name: Verify frontend UX source
on:
  push:
    branches: [codex/frontend-ux-20260910]
permissions:
  contents: write
concurrency:
  group: frontend-ux-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'deeeeeeeeap/cloud-mail-deeeeeeeeap' && github.ref == 'refs/heads/codex/frontend-ux-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-vue/pnpm-lock.yaml
      - name: Apply checksum-verified review correction
        run: |
          node .github/frontend-ux-review.cjs
          git diff --check
      - name: Full release gate with locked dependencies (no deployment)
        run: node scripts/cloudflare-workers-git-build.mjs
      - name: Commit verified review fix and remove temporary workflow
        run: |
          git rm .github/frontend-ux-review.cjs .github/workflows/frontend-ux-verify.yml
          git add mail-vue
          git diff --cached --check
          ROOT_TREE="$(git write-tree)"
          FRONTEND_TREE="$(git ls-tree "$ROOT_TREE" mail-vue | awk '{print $3}')"
          test "$FRONTEND_TREE" = '063ae6d59059ab3d3614191df242730e98f57a99'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: retain mobile writer safe-area padding after base styles'
          git push origin HEAD:refs/heads/codex/frontend-ux-20260910
