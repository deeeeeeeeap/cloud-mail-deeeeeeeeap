name: Prepare v1.3.0 review workspace
on:
  push:
    branches: [codex/storage-domain-v1.3.0-20260910]
    paths: [.github/workflows/v130-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 18aa76549a8890436e988eb1425a2d0c2ea28f62
          persist-credentials: false
      - name: Archive exact reviewed main source
        run: |
          test "$(git rev-parse HEAD)" = 18aa76549a8890436e988eb1425a2d0c2ea28f62
          git archive --format=tar HEAD | gzip -n > /tmp/v130-main-source.tar.gz
          sha256sum /tmp/v130-main-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: v130-main-source
          path: /tmp/v130-main-source.tar.gz
          retention-days: 1
