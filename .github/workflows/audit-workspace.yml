name: Prepare isolated audit workspace

on:
  push:
    branches: [codex/security-reliability-20260910]
    paths: [.github/workflows/audit-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked development dependencies (no deployment)
        run: |
          pnpm --dir mail-worker install --frozen-lockfile
          pnpm --dir mail-vue install --frozen-lockfile
      - name: Package source and development dependencies, excluding Git credentials
        run: tar --exclude='./.git' -czf "$RUNNER_TEMP/audit-workspace.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: audit-workspace
          path: ${{ runner.temp }}/audit-workspace.tar.gz
          retention-days: 1
          compression-level: 0
